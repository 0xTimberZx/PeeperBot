name: Fade watch

# Live alert for the one CORE confluence that held up out of sample: CORE and
# BTC/ETH dump together over 30 minutes → bet the major bounces for 30. It pings
# Telegram and never trades. Backtest: `npm run bot:fade -- --days 540`.
#
# Why this is a long-running job and not a 5-minute cron like the other
# watchers: the edge is in entering at the 5m close. GitHub's scheduler runs
# 5–15 minutes late, and one bar late is already breakeven. So each job runs the
# watch loop for ~3h20m (waking ~3s after every 5m close) and then starts its
# own successor. The concurrency group makes that next job queue until the
# running one exits, so coverage is back-to-back with a gap of about a minute.
#
# The chain does not rely on GitHub's scheduler, which stopped firing in this
# repo. The cron below is only a backstop that restarts the chain if it ever
# breaks; when the chain is healthy the extra scheduled run just replaces the
# queued successor. To start it: Actions → Fade watch → Run workflow. To stop
# it: cancel the running job (a cancelled job starts no successor) or disable
# the workflow. After a failure it retries, but gives up after 3 in a row so a
# broken build cannot loop forever.
#
# Shadow (Peeper 1.01): candidate rules are evaluated on every close and
# journaled to data/fade-shadow.jsonl, scored by --report, never alerted.
# Set the FADE_SHADOW variable to "off" to stop them.
#
# NY open caution: alerts (and sandwiches) fired 09:00–10:30 New York time on
# weekdays carry a warning — the rule has been only breakeven there (52.7% vs
# 57% elsewhere). FADE_NY_CAUTION=off removes it.
#
# Peeper 1.02: every alert also records MSTR's move over the same 30m window
# (OKX's MSTR perpetual). --report splits the live record by whether MSTR
# joined the dump. Recorded only — alerts are unchanged. FADE_CONFIRM=off
# disables it; FADE_CONFIRM_SYMBOL / FADE_CONFIRM_PCT (0.3) tune it.
#
# Confidence: the bot starts SKEPTICAL (single-bet alerts only). Once 50 calls
# have settled and the last 50 win 55%+ (FADE_CONFIDENCE_WINDOW / _UP_PCT) it
# turns CONFIDENT and also sends dip-sandwich alerts: if an open call goes 0.2%
# against within 15 min (FADE_SANDWICH_DIP_PCT / _WITHIN_MIN), add a second bet
# that settles with the first. Below breakeven it drops back to skeptical.
# Sandwich setups are logged to data/fade-sandwiches.jsonl either way.
# FADE_SANDWICH=off disables them entirely.
#
# Quiet (default): every fade call is sent in two lines; near-low ones are
# marked (unproven, scored separately by --report), top-of-range ones cautioned.
# "Bet losing" warnings, review replies and stage-change messages are logged
# but not sent. The daily imbalance callout is sent (IMBALANCE_OFF=1 stops it).
# FADE_QUIET=off brings back long alerts and every message; FADE_NEAR_LOW=only
# sends near-low calls only (others logged to data/fade-shadow.jsonl), =off
# drops the band check.
#
# Reviews: when a call settles, the bot replies under the alert with how it
# played out — clean win, narrow loss, gave it back, or a complete blowout.
#
# Replies: answer an alert in Telegram with won / lost / missed (or a synonym,
# ✅ / ❌) and the bot logs it and replies with your running record. No reply
# within 2h of the settle (FADE_AUTO_MISS_MIN) counts as missed, quietly.
#
# Against-warnings: if an open call moves FADE_AGAINST_PCT (0.3%) against the
# bet, the bot replies under it once, naming the 4h/daily imbalance price is
# heading into and where that imbalance ends. No daily cap.
#
# Imbalance callout: the same job scans BTC/ETH every 15 min and, at most once
# per 24h (IMBALANCE_CAP_HOURS), calls out a fast move into a fresh 4h/daily
# imbalance with its end level and historical odds. IMBALANCE_OFF=1 disables.
# Its prices come from KuCoin, then Gate.io, then OKX (IMBALANCE_FEED to change).
#
# State: the open-call latch, the alert journal and your replies live in apps/prdt-bot/data
# and are carried between jobs by actions/cache (the folder as one path, so new
# data files never reset it). The folder is also uploaded as an artifact on every
# run; on a cache miss the next job rebuilds the history from those uploads. The
# live record is printed at the end of each job.
#
# Secrets (same as the other watchers): TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# Variables (optional): FADE_TARGETS (default BTCUSDT,ETHUSDT),
#   FADE_LEAD_MOVE_PCT (1.5), FADE_OWN_MOVE_PCT (0.15), FADE_HOLD_MIN (30),
#   FADE_MAX_LATE_SEC (120).
#
# Test the wiring: Actions → Fade watch → Run workflow → set "test" to true.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      test: { description: "Send a sample alert and exit", required: false }
      report: { description: "Print the live record and exit", required: false }
      failures: { description: "Internal: consecutive failed jobs so far", required: false, default: "0" }

permissions:
  contents: read
  actions: write # lets the job start its own successor

concurrency:
  group: fade-watch
  cancel-in-progress: false

jobs:
  watch:
    # FADE_RUNNER picks the machine. Unset = GitHub's runners (free while the
    # repo is public). Before making the repo private, register a self-hosted
    # runner (Settings → Actions → Runners) and set FADE_RUNNER=self-hosted:
    # this job runs 24/7 (~43,000 min/month), far past a private repo's allowance.
    # Only the word "self-hosted" switches runners. Anything else — unset, blank,
    # or a stray space (which GitHub treats as a real label, so the job would
    # queue forever) — stays on GitHub's runners.
    runs-on: ${{ contains(vars.FADE_RUNNER, 'self-hosted') && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The whole data folder is cached as ONE path. GitHub ties a cache to its
      # exact path list, so listing files one by one meant every new data file
      # silently started an empty history. A folder never changes, whatever the
      # bot writes into it.
      - name: Restore latch + journal
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: apps/prdt-bot/data
          key: fade-data-${{ github.run_id }}
          restore-keys: |
            fade-data-
      - name: Install dependencies
        run: npm ci
      # Safety net: on a cache miss (evicted, or the cache layout changed), rebuild
      # the history from the journal uploaded by the latest run, plus RECOVER_RUNS
      # (older runs whose history was cut off by earlier cache misses). Merging is
      # de-duplicated, so it is harmless to run more than once.
      - name: Recover history on a cache miss
        if: steps.restore.outputs.cache-matched-key == '' && github.event.inputs.test != 'true'
        continue-on-error: true
        working-directory: apps/prdt-bot
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_RUNS: "45072147140 45090896236"
        run: |
          mkdir -p data recovered
          latest=""
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow fade-watch.yml --status completed --limit 15 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n fade-journal -D "recovered/$id" 2>/dev/null; then latest=$id; break; fi
          done
          for id in $RECOVER_RUNS; do
            [ "$id" = "$latest" ] && continue
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n fade-journal -D "recovered/$id" || echo "::warning::no journal artifact for run $id"
          done
          if ls -d recovered/*/ >/dev/null 2>&1; then
            # Latest first, so its state files win over older ones.
            npx tsx src/watch/mergeData.ts data $( [ -n "$latest" ] && echo "recovered/$latest" ) $(ls -d recovered/*/ | grep -v "recovered/$latest/")
          else
            echo "::warning::cache miss and no journal artifact found - starting a fresh history"
          fi
          rm -rf recovered
      # Grade any settled call the last job didn't get to (no messages sent).
      - name: Review past calls
        if: github.event.inputs.test != 'true' && github.event.inputs.report != 'true'
        continue-on-error: true
        env:
          FEED_SOURCE: okx
          FEED_FALLBACKS: bybit
        run: npm run fadewatch --workspace=apps/prdt-bot -- --review
      - name: Watch
        id: watch
        env:
          FEED_SOURCE: okx
          FEED_FALLBACKS: bybit
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FADE_TARGETS: ${{ vars.FADE_TARGETS }}
          FADE_LEAD_MOVE_PCT: ${{ vars.FADE_LEAD_MOVE_PCT }}
          FADE_OWN_MOVE_PCT: ${{ vars.FADE_OWN_MOVE_PCT }}
          FADE_HOLD_MIN: ${{ vars.FADE_HOLD_MIN }}
          FADE_MAX_LATE_SEC: ${{ vars.FADE_MAX_LATE_SEC }}
          FADE_AUTO_MISS_MIN: ${{ vars.FADE_AUTO_MISS_MIN }}
          FADE_AGAINST_PCT: ${{ vars.FADE_AGAINST_PCT }}
          IMBALANCE_TARGETS: ${{ vars.IMBALANCE_TARGETS }}
          IMBALANCE_CAP_HOURS: ${{ vars.IMBALANCE_CAP_HOURS }}
          IMBALANCE_OFF: ${{ vars.IMBALANCE_OFF }}
          IMBALANCE_FEED: ${{ vars.IMBALANCE_FEED }}
          FADE_SHADOW: ${{ vars.FADE_SHADOW }}
          FADE_SANDWICH: ${{ vars.FADE_SANDWICH }}
          FADE_SANDWICH_DIP_PCT: ${{ vars.FADE_SANDWICH_DIP_PCT }}
          FADE_SANDWICH_WITHIN_MIN: ${{ vars.FADE_SANDWICH_WITHIN_MIN }}
          FADE_CONFIDENCE_WINDOW: ${{ vars.FADE_CONFIDENCE_WINDOW }}
          FADE_CONFIDENCE_UP_PCT: ${{ vars.FADE_CONFIDENCE_UP_PCT }}
          FADE_CONFIRM: ${{ vars.FADE_CONFIRM }}
          FADE_CONFIRM_SYMBOL: ${{ vars.FADE_CONFIRM_SYMBOL }}
          FADE_CONFIRM_PCT: ${{ vars.FADE_CONFIRM_PCT }}
          FADE_NY_CAUTION: ${{ vars.FADE_NY_CAUTION }}
          FADE_QUIET: ${{ vars.FADE_QUIET }}
          # Adds where losing calls settled since this date to each signal; "off" removes it.
          FADE_LOSS_FROM: ${{ vars.FADE_LOSS_FROM || '2026-11-20' }}
          FADE_NEAR_LOW: ${{ vars.FADE_NEAR_LOW }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            npm run fadewatch --workspace=apps/prdt-bot -- --test
          elif [ "${{ github.event.inputs.report }}" = "true" ]; then
            npm run fadewatch --workspace=apps/prdt-bot -- --report
          else
            npm run fadewatch --workspace=apps/prdt-bot -- --for 200
          fi
      - name: Live record
        if: always() && github.event.inputs.test != 'true' && github.event.inputs.report != 'true'
        env:
          FEED_SOURCE: okx
          FEED_FALLBACKS: bybit
        run: npm run fadewatch --workspace=apps/prdt-bot -- --report
      - name: Save latch + journal
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/prdt-bot/data
          key: fade-data-${{ github.run_id }}
      - name: Upload journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fade-journal
          path: apps/prdt-bot/data
          if-no-files-found: ignore
          # A fresh copy every job: keep a few days, not the 90-day default
          # (private repos count artifacts against a 500 MB / 1 GB allowance).
          retention-days: 5
      # Last step on purpose: the successor queues behind this job and starts
      # seconds after it exits. Skipped for test/report runs and when cancelled.
      - name: Start the next watch job
        if: ${{ !cancelled() && github.event.inputs.test != 'true' && github.event.inputs.report != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_OUTCOME: ${{ steps.watch.outcome }}
          FAILURES: ${{ github.event.inputs.failures || '0' }}
        run: |
          if [ "$WATCH_OUTCOME" = "success" ]; then
            next=0
          else
            next=$((FAILURES + 1))
            if [ "$next" -ge 3 ]; then
              echo "::error::Fade watch failed $next times in a row - not restarting. Fix it, then Run workflow."
              exit 1
            fi
            sleep 120
          fi
          gh workflow run fade-watch.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f failures="$next"
