name: Follow watch

# Polls a trader's X posts and pings Telegram when he opens a position, so you
# can put on the same direction for your own horizon. It never trades.
#
# Reaction time: GitHub's scheduler has a 5-minute minimum and routinely runs
# late under load, so treat this as "within ~5-15 minutes". That is fine for a
# 12h hold and not fine for scalping — if you need to be on it in seconds, run
# `npm run bot:follow` locally (or on a small VM) where the poll is 2 minutes
# and nothing throttles it.
#
# State: a cron process has no memory, so the seen-post latch lives in
# apps/prdt-bot/data/follow-state.json and is carried between runs by
# actions/cache. Without it every run re-alerts on the same post. Delete the
# cache entry to reset (it will then ignore anything older than X_MAX_AGE_MIN,
# so it still won't blast you with old calls).
#
# Set up once, under Settings → Secrets and variables → Actions:
#
#   Secrets (required):
#     XAPI_KEY             your twitterapi.io key
#     TELEGRAM_BOT_TOKEN   from @BotFather
#     TELEGRAM_CHAT_ID     from @userinfobot
#
#   Variables — set this one, it is a 20x cost difference:
#     XAPI_PATH=/twitter/tweet/advanced_search?query=from%3A{handle}%20since_time%3A{sinceTime}&queryType=Latest
#
#     Without it each tick calls last_tweets, which serves a fixed 20-post page
#     and bills for all of it (~300 credits, ~$8.64/month at this cron). With
#     it the query is bounded to the window the watcher would actually act on,
#     so a quiet tick costs ~15 credits (~$0.43/month). Measured, not estimated.
#
#   Variables (optional): X_HANDLE (default ChentoTrades), X_HORIZON_HOURS
#     (default 12), X_ENTRY_FLOOR, X_MAX_AGE_MIN, X_STALE_MIN, XAPI_BASE.
#
# Test the wiring without spending anything: Actions → Follow watch → Run
# workflow → set "test" to true. That path sends a canned alert and returns
# before the X API is ever contacted, so it proves Telegram delivery for free.

on:
  schedule:
    # Every 15 min, not GitHub's 5-min floor — this is a spending decision.
    # twitterapi.io serves a fixed 20-post page and ignores the count
    # parameter, so each tick costs ~300 credits whatever X_FETCH_LIMIT says:
    # */5 is ~$26/month, */15 is ~$9. On a 12h horizon the extra latency is
    # immaterial, and the alert states how late you are either way.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      handle: { description: "X handle to follow (no @)", required: false }
      horizon: { description: "Copy horizon in hours", required: false }
      test: { description: "Send a sample alert and exit", required: false }

concurrency:
  group: follow-watch
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore seen-post latch
        uses: actions/cache/restore@v4
        with:
          path: apps/prdt-bot/data/follow-state.json
          key: follow-state-${{ github.run_id }}
          restore-keys: |
            follow-state-
      - name: Install dependencies
        run: npm ci
      - name: Poll (one-shot)
        env:
          FEED_SOURCE: okx
          FEED_FALLBACKS: bybit
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          XSOURCE: thirdparty
          XAPI_KEY: ${{ secrets.XAPI_KEY }}
          XAPI_BASE: ${{ vars.XAPI_BASE }}
          XAPI_PATH: ${{ vars.XAPI_PATH }}
          XAPI_AUTH_HEADER: ${{ vars.XAPI_AUTH_HEADER }}
          # Cost levers. XAPI_SINCE_PARAM is the big one: without it every
          # 5-minute tick pays to re-read posts it already has. X_FETCH_LIMIT
          # defaults to 10; raise it only after watching what a tick spends.
          XAPI_SINCE_PARAM: ${{ vars.XAPI_SINCE_PARAM }}
          X_FETCH_LIMIT: ${{ vars.X_FETCH_LIMIT }}
          X_HANDLE: ${{ github.event.inputs.handle || vars.X_HANDLE }}
          X_HORIZON_HOURS: ${{ github.event.inputs.horizon || vars.X_HORIZON_HOURS }}
          X_ENTRY_FLOOR: ${{ vars.X_ENTRY_FLOOR }}
          X_MAX_AGE_MIN: ${{ vars.X_MAX_AGE_MIN }}
          X_STALE_MIN: ${{ vars.X_STALE_MIN }}
          X_EXTRA_SYMBOLS: ${{ vars.X_EXTRA_SYMBOLS }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            npm run follow --workspace=apps/prdt-bot -- --test
          else
            npm run follow --workspace=apps/prdt-bot -- --once
          fi
      - name: Save seen-post latch
        if: always()
        uses: actions/cache/save@v4
        with:
          path: apps/prdt-bot/data/follow-state.json
          key: follow-state-${{ github.run_id }}
